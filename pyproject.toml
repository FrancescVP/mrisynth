[project]
name = "gan-data-processing"
version = "0.1.0"
description = "Preprocessing, losses, metrics, and models for multimodal MRI synthesis (pix2pix + latent diffusion)."
requires-python = ">=3.10"
dependencies = [
    "nibabel>=5.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.2",
    "batchgeneratorsv2>=0.1",
    "tensorboard>=2.14",
    "monai>=1.3",
    "einops>=0.7",
    "tqdm>=4.64",
    "matplotlib>=3.10.9",
    "pillow>=12.2.0",
    "imageio>=2.37.3",
]

[project.scripts]
gan-preprocess = "gan_data_processing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gan_data_processing"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
